<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Inbox // Project HMC</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06010d;--cyan:#00fff2;--pink:#ff1f8e;--violet:#b026ff;--muted:#a58fc7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:#f3eaff;font-family:'JetBrains Mono',monospace;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 22px;border-bottom:1px solid var(--pink);box-shadow:0 0 18px rgba(255,31,142,.5)}
  h1{font-family:'Orbitron';font-size:15px;letter-spacing:3px;text-shadow:0 0 6px #fff,0 0 16px var(--cyan)}
  button{font:inherit;cursor:pointer;background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:8px 16px;text-transform:uppercase;letter-spacing:1px;font-size:12px}
  button:hover{background:var(--cyan);color:#000}
  #login{display:grid;place-items:center;height:70vh;text-align:center}
  #login p{margin-bottom:16px}
  #err{color:var(--pink);font-size:13px;min-height:1.3em;margin-top:14px}
  #app{display:none;grid-template-columns:300px 1fr;height:calc(100vh - 56px)}
  #list{border-right:1px solid var(--violet);overflow-y:auto}
  .t{padding:12px 16px;border-bottom:1px solid rgba(176,38,255,.3);cursor:pointer}
  .t:hover,.t.on{background:rgba(255,31,142,.13)}
  .t b{display:block;font-size:13px}
  .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chat{display:flex;flex-direction:column;min-width:0}
  #who{padding:12px 16px;border-bottom:1px solid var(--violet);font-size:13px;color:var(--cyan)}
  .t small{display:block;font-size:10px;color:var(--violet);margin-top:2px}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:75%;padding:9px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
  .m.v{align-self:flex-start;border:1px solid var(--cyan);box-shadow:0 0 10px rgba(0,255,242,.35)}
  .m.a{align-self:flex-end;border:1px solid var(--pink);box-shadow:0 0 10px rgba(255,31,142,.4)}
  .m time{display:block;font-size:10px;color:var(--muted);margin-top:4px}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--violet)}
  input{flex:1;min-width:0;background:#0a0214;border:1px solid var(--violet);color:#fff;padding:10px;font:inherit;font-size:13px;outline:none}
  input:focus{border-color:var(--cyan)}
  @media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:190px 1fr}#list{border-right:0;border-bottom:1px solid var(--violet)}}
</style>
</head>
<body>
<header><h1>PROJECT HMC // INBOX</h1><button id="out" hidden>Sign out</button></header>

<div id="login"><div>
  <p>Owner access only.</p>
  <button id="in">Sign in with Google</button>
  <p id="err"></p>
</div></div>

<div id="app">
  <div id="list"></div>
  <div id="chat">
    <div id="who">Select a conversation to see the full chat history.</div>
    <div id="msgs"></div>
    <form id="f"><input id="txt" maxlength="500" placeholder="Select a conversation, then reply..." autocomplete="off"><button>Send</button></form>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import { getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
  import { firebaseConfig } from './firebase-config.js';

  // Only this Google account can open the inbox. The same email is enforced in firestore.rules.
  const ADMIN_EMAIL = 'musfiqurrahimsiam@gmail.com';

  const $ = id => document.getElementById(id);
  const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
  let unsubList = null, unsubMsgs = null, current = null;

  $('in').onclick = async () => {
    $('err').textContent = '';
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { $('err').textContent = 'Sign-in failed. Check the setup guide.'; }
  };
  $('out').onclick = () => signOut(auth);

  onAuthStateChanged(auth, u => {
    if (u && u.isAnonymous) { signOut(auth); return; }
    const ok = !!u && u.email === ADMIN_EMAIL && u.emailVerified;
    if (u && !ok) { $('err').textContent = 'This account is not authorized.'; signOut(auth); return; }
    $('login').style.display = ok ? 'none' : 'grid';
    $('app').style.display = ok ? 'grid' : 'none';
    $('out').hidden = !ok;
    if (unsubList) { unsubList(); unsubList = null; }
    if (ok) loadThreads();
  });

  function loadThreads() {
    const q = query(collection(db, 'threads'), orderBy('lastMessageAt', 'desc'), limit(100));
    unsubList = onSnapshot(q, snap => {
      const list = $('list');
      list.replaceChildren();
      snap.forEach(d => {
        const t = d.data();
        const el = document.createElement('div');
        el.className = 't' + (d.id === current ? ' on' : '');
        const b = document.createElement('b'); b.textContent = t.name || 'Guest';
        const s = document.createElement('span'); s.textContent = t.lastText || '';
        const when = document.createElement('small');
        when.textContent = t.lastMessageAt && t.lastMessageAt.toDate ? t.lastMessageAt.toDate().toLocaleString() : '';
        el.append(b, s, when);
        el.onclick = () => {
          list.querySelectorAll('.t').forEach(x => x.classList.remove('on'));
          el.classList.add('on');
          openThread(d.id, t.name);
        };
        list.appendChild(el);
      });
    });
  }

  function openThread(id, name) {
    current = id;
    $('who').textContent = 'Chat with: ' + (name || 'Guest');
    if (unsubMsgs) unsubMsgs();
    const q = query(collection(db, 'threads', id, 'messages'), orderBy('ts'), limit(300));
    unsubMsgs = onSnapshot(q, snap => {
      const box = $('msgs');
      box.replaceChildren();
      snap.forEach(d => {
        const m = d.data({ serverTimestamps: 'estimate' });
        const el = document.createElement('div');
        el.className = 'm ' + (m.from === 'admin' ? 'a' : 'v');
        el.appendChild(document.createTextNode(String(m.text || '')));
        const t = document.createElement('time');
        t.textContent = m.ts && m.ts.toDate ? m.ts.toDate().toLocaleString() : '';
        el.appendChild(t);
        box.appendChild(el);
      });
      box.scrollTop = box.scrollHeight;
    });
    $('txt').focus();
  }

  $('f').onsubmit = async e => {
    e.preventDefault();
    const text = $('txt').value.trim().slice(0, 500);
    if (!text || !current) return;
    $('txt').value = '';
    try {
      await setDoc(doc(db, 'threads', current),
        { lastText: ('You: ' + text).slice(0, 120), lastMessageAt: serverTimestamp() }, { merge: true });
      await addDoc(collection(db, 'threads', current, 'messages'),
        { text, from: 'admin', ts: serverTimestamp() });
    } catch (err) { $('txt').value = text; }
  };
</script>
</body>
</html>
